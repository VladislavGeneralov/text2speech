<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Bedtime Reader</title>
<style>
  :root {
    --bg: #121212;
    --card: #1c1c1c;
    --text: #d8d4cc;
    --muted: #8a857c;
    --accent: #c9a86a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .author { margin: 2px 0 0; color: var(--muted); }

  /* sticky so the speed control stays reachable while scrolling the chapter list */
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { color: var(--muted); min-width: 3.5em; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); touch-action: manipulation; }
  .row output { min-width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  .speed {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--bg);
    padding: 8px 0;
  }

  .mix { display: flex; flex-direction: column; gap: 10px; }
  .music-load { display: flex; gap: 8px; }
  .music-load input {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 0 12px;
    border: 0;
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 16px; /* below 16px iOS Safari zooms the page on focus */
  }
  .music-load button { min-width: 64px; }
  .msg:empty { display: none; }

  .text-panel {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .text-panel[hidden] { display: none; }
  .text-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .text-head .msg { font-size: 14px; }
  .text-head button { min-width: 72px; }
  .text {
    max-height: 45vh;
    overflow-y: auto;
    font-size: 17px;
    line-height: 1.55;
    color: var(--muted);
    -webkit-user-select: text;
    user-select: text;
  }
  .text p { margin: 0 0 0.7em; }
  .text p.h { color: var(--text); font-weight: 600; }
  .text .now { color: var(--text); }

  .now-card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .now-title { font-weight: 500; }
  .num { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* compact chapter list: one tappable line per chapter */
  .chapters { display: flex; flex-direction: column; }
  .ch-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    min-height: 40px;
    padding: 8px 4px;
    border: 0;
    border-bottom: 1px solid #242424;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    text-align: left;
    touch-action: manipulation;
  }
  .ch-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-item .dur { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ch-item.active .t { color: var(--accent); }
  .ch-item:active { background: #1a1a1a; }
  .ctl { display: flex; align-items: center; gap: 10px; }
  .ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); touch-action: manipulation; }
  .ctl .pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ctl .play { width: 44px; flex: none; }
  .skip { display: flex; gap: 10px; }
  .skip button { flex: 1; }
  .ctl .play, .skip button, .music-load button, .text-head button {
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: #2a2a2a;
    color: var(--text);
    font: inherit;
    touch-action: manipulation;
  }
  .ctl .play:active, .skip button:active, .music-load button:active, .text-head button:active { background: #353535; }
  .music-load button:disabled { opacity: 0.4; }
  .msg { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">…</h1>
    <p class="author" id="author"></p>
  </header>

  <section class="mix">
    <div class="row">
      <label for="bookVol">Book</label>
      <input type="range" id="bookVol" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="row">
      <label for="musicVol">Music</label>
      <input type="range" id="musicVol" min="0" max="1" step="0.01" value="0.3">
    </div>
    <div class="music-load">
      <input type="url" id="scUrl" placeholder="SoundCloud link" autocomplete="off">
      <button type="button" id="scLoad">Load</button>
      <button type="button" id="scToggle" disabled>▶</button>
    </div>
    <p class="msg" id="scStatus"></p>
  </section>

  <div class="row speed">
    <label for="rate">Speed</label>
    <input type="range" id="rate" min="0.7" max="1.5" step="0.05" value="1">
    <output id="rateOut" for="rate">1.00×</output>
  </div>

  <section class="now-card">
    <div class="now-title"><span class="num" id="nowNum"></span> <span id="nowTitle"></span></div>
    <div class="ctl">
      <button type="button" class="play" id="playBtn" aria-label="Play">▶</button>
      <input type="range" id="seek" min="0" max="1" step="1" value="0" aria-label="Position">
      <span class="pos" id="pos">0:00</span>
    </div>
    <div class="skip">
      <button type="button" data-skip="-15">−15 s</button>
      <button type="button" data-skip="15">+15 s</button>
    </div>
  </section>

  <section class="text-panel" id="textPanel" hidden>
    <div class="text-head">
      <span class="msg" id="textInfo">±15 s</span>
      <button type="button" id="copyText">Copy</button>
    </div>
    <div class="text" id="text"></div>
  </section>

  <section class="chapters" id="chapters"></section>
  <audio id="player" preload="metadata"></audio>
</main>

<script>
const $ = id => document.getElementById(id);
const rate = $("rate"), rateOut = $("rateOut");
// One shared <audio> for all chapters: iOS won't let a locked/background page start a
// *different* media element, but it does let the playing one switch src on "ended".
const player = $("player");

function load(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function fmt(sec) {
  if (sec < 60) return `${Math.round(sec)} s`;
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}

function clock(sec) {
  sec = Math.floor(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
}

function applyRate() {
  const r = parseFloat(rate.value);
  rateOut.textContent = r.toFixed(2) + "×";
  player.defaultPlaybackRate = r; player.playbackRate = r;
  save("rate", r);
}
rate.value = load("rate", "1");
rate.addEventListener("input", applyRate);

// ---- Mixer: book + background music, each with its own gain ----
// iOS Safari ignores audio.volume set from JS, so both channels go through Web Audio
// GainNodes. The context may only start inside a user gesture, hence unlockAudio()
// on every tap.
if (navigator.audioSession) navigator.audioSession.type = "playback";  // play with the silent switch on
let ctx = null, bookGain, musicGain;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    bookGain = ctx.createGain(); bookGain.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.connect(ctx.destination);
    ctx.createMediaElementSource(player).connect(bookGain);
    applyVolumes();
  }
  if (ctx.state !== "running") ctx.resume();
}
function unlockAudio() { ensureCtx(); }
document.addEventListener("touchend", unlockAudio, { capture: true, passive: true });
document.addEventListener("click", unlockAudio, { capture: true });

const bookVol = $("bookVol"), musicVol = $("musicVol");
function applyVolumes() {
  save("bookVol", bookVol.value); save("musicVol", musicVol.value);
  if (!ctx) return;
  bookGain.gain.setTargetAtTime(parseFloat(bookVol.value), ctx.currentTime, 0.03);
  musicGain.gain.setTargetAtTime(parseFloat(musicVol.value), ctx.currentTime, 0.03);
}
bookVol.value = load("bookVol", "1");
musicVol.value = load("musicVol", "0.3");
bookVol.addEventListener("input", applyVolumes);
musicVol.addEventListener("input", applyVolumes);

// ---- Background music from a SoundCloud link, looped (loading as in SCDJ) ----
// api-v2.soundcloud.com only allows CORS for soundcloud.com, so resolve goes through
// the SCDJ Cloudflare Worker proxy.
const SC_PROXY = "https://scdj-proxy.ptntonesix.workers.dev";
const SC_CLIENT_ID = "Pb72ranhoyt6gw7hM7TkzUItXlMWSNSo";
const scUrl = $("scUrl"), scLoad = $("scLoad"), scToggle = $("scToggle"), scStatus = $("scStatus");
let musicBuf = null, musicNode = null;

function proxyFetch(path, params) {
  return fetch(SC_PROXY + path + "?" + new URLSearchParams(params)).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

async function fetchStreamBytes(track) {
  const tc = (track.media && track.media.transcodings) || [];
  const prog = tc.find(t => t.format && t.format.protocol === "progressive");
  // progressive is being phased out on SoundCloud; mp3 HLS segments concatenate
  // into a plain mp3 that decodeAudioData accepts
  const hls = tc.find(t => t.format && t.format.protocol === "hls" && /mpeg/.test(t.format.mime_type));
  const pick = prog || hls;
  if (!pick) throw new Error("no playable stream for this track");
  const { url } = await proxyFetch("/api/media", { url: pick.url, client_id: SC_CLIENT_ID });
  if (pick === prog) return fetch(url).then(r => r.arrayBuffer());
  const playlist = await fetch(url).then(r => r.text());
  const segs = playlist.split("\n").filter(l => l && !l.startsWith("#"));
  const parts = await Promise.all(segs.map(s => fetch(new URL(s, url)).then(r => r.arrayBuffer())));
  return new Blob(parts).arrayBuffer();
}

function stopMusic() {
  if (musicNode) { musicNode.stop(); musicNode.disconnect(); musicNode = null; }
  scToggle.textContent = "▶";
}
function startMusic() {
  stopMusic();
  ensureCtx();
  musicNode = ctx.createBufferSource();
  musicNode.buffer = musicBuf;
  musicNode.loop = true;
  musicNode.connect(musicGain);
  musicNode.start();
  scToggle.textContent = "❚❚";
}

async function loadMusic() {
  const link = scUrl.value.trim();
  if (!link) return;
  ensureCtx();
  save("scUrl", link);
  scLoad.disabled = true;
  scStatus.textContent = "Loading…";
  try {
    const track = await proxyFetch("/api/resolve", { url: link, client_id: SC_CLIENT_ID });
    if (track.kind !== "track") throw new Error("link is not a single track");
    const bytes = await fetchStreamBytes(track);
    musicBuf = await ctx.decodeAudioData(bytes);
    scStatus.textContent = (track.title || "") + (track.user ? " — " + track.user.username : "");
    scToggle.disabled = false;
    startMusic();
  } catch (e) {
    scStatus.textContent = "Could not load: " + e.message;
  } finally {
    scLoad.disabled = false;
  }
}
scUrl.value = load("scUrl", "");
scLoad.addEventListener("click", loadMusic);
scUrl.addEventListener("keydown", e => { if (e.key === "Enter") loadMusic(); });
scToggle.addEventListener("click", () => (musicNode ? stopMusic() : startMusic()));

// ---- Chapters on the shared player ----
let book = null, base = "";
const rows = [];   // per chapter: { ch, item } — item is its line in the chapter list
let cur = -1;      // index of the chapter loaded into the player
const playBtn = $("playBtn"), seek = $("seek"), pos = $("pos");
let dragging = false;
const pad = n => String(n).padStart(2, "0");

function skip(sec) {
  if (cur < 0) return;
  const end = isFinite(player.duration) ? player.duration : Infinity;
  player.currentTime = Math.min(Math.max(0, player.currentTime + sec), end);
}

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("seekbackward", () => skip(-15));
  navigator.mediaSession.setActionHandler("seekforward", () => skip(15));
}

// ---- Text window: sentences spoken within ±15 s of the current position ----
const WINDOW = 15;
const textPanel = $("textPanel"), textBox = $("text"), textInfo = $("textInfo");
let segs = [], spans = [], paras = [], shown = [-1, -1], nowIdx = -1;

async function loadText(i) {
  segs = []; spans = []; paras = []; shown = [-1, -1]; nowIdx = -1;
  textBox.textContent = "";
  const file = rows[i].ch.text;
  textPanel.hidden = !file;
  if (!file) return;
  const data = await fetch(base + file).then(r => r.json());
  if (cur !== i) return;  // chapter changed while loading
  segs = data;
  let p = null;
  for (const [, , s, kind] of segs) {
    if (!p || kind > 0) {
      p = document.createElement("p");
      if (kind === 2) p.className = "h";
      textBox.append(p);
      paras.push(p);
    }
    const span = document.createElement("span");
    span.textContent = s + " ";
    span.hidden = true;
    span.para = p;
    p.append(span);
    spans.push(span);
  }
  updateText(player.currentTime, true);
}

function selectionInText() {
  const sel = document.getSelection();
  return sel && !sel.isCollapsed && textBox.contains(sel.anchorNode);
}

function updateText(t, force = false) {
  if (!segs.length || (!force && selectionInText())) return;  // don't wreck a selection being copied
  let lo = segs.findIndex(s => s[1] > t - WINDOW);
  if (lo < 0) lo = segs.length - 1;
  let hi = lo;
  while (hi + 1 < segs.length && segs[hi + 1][0] < t + WINDOW) hi++;
  if (force || lo !== shown[0] || hi !== shown[1]) {
    spans.forEach((sp, k) => { sp.hidden = k < lo || k > hi; });
    for (const p of paras) p.hidden = !p.querySelector("span:not([hidden])");
    shown = [lo, hi];
  }
  const now = segs.findIndex(s => s[0] <= t && t < s[1]);
  if (now !== nowIdx) {
    if (nowIdx >= 0) spans[nowIdx].classList.remove("now");
    if (now >= 0) spans[now].classList.add("now");
    nowIdx = now;
  }
}

$("copyText").addEventListener("click", async () => {
  const sel = selectionInText() ? document.getSelection().toString() : "";
  const text = sel || paras.filter(p => !p.hidden)
    .map(p => [...p.children].filter(s => !s.hidden).map(s => s.textContent).join("").trim())
    .join("\n\n");
  try {
    await navigator.clipboard.writeText(text);
    textInfo.textContent = "Copied";
  } catch {
    textInfo.textContent = "Copy failed — select the text instead";
  }
  setTimeout(() => { textInfo.textContent = "±15 s"; }, 1500);
});

// Load chapter i into the shared player (and its text); play only when asked.
function selectChapter(i) {
  if (i === cur) return;
  if (cur >= 0) rows[cur].item.classList.remove("active");
  cur = i;
  const r = rows[i];
  r.item.classList.add("active");
  $("nowNum").textContent = pad(i + 1);
  $("nowTitle").textContent = r.ch.title;
  seek.max = r.ch.duration; seek.value = 0; pos.textContent = "0:00";
  player.src = base + r.ch.file;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `${pad(i + 1)} · ${r.ch.title}`, artist: book.author, album: book.title });
  }
  loadText(i).catch(() => { textPanel.hidden = true; });
}

function playChapter(i, startAt = 0) {
  ensureCtx();
  if (i !== cur) {
    selectChapter(i);
    if (startAt > 0) player.addEventListener("loadedmetadata", () => { player.currentTime = startAt; }, { once: true });
  }
  player.play();
}

playBtn.addEventListener("click", () => {
  if (cur < 0) return;
  if (player.paused) { ensureCtx(); player.play(); } else player.pause();
});
seek.addEventListener("input", () => { dragging = true; pos.textContent = clock(seek.value); });
seek.addEventListener("change", () => {
  dragging = false;
  if (cur >= 0) player.currentTime = parseFloat(seek.value);
});
document.querySelectorAll("[data-skip]").forEach(b =>
  b.addEventListener("click", () => skip(parseFloat(b.dataset.skip))));

// iOS Safari resets playbackRate whenever the source changes, so reapply on every play
player.addEventListener("play", () => {
  player.playbackRate = parseFloat(rate.value);
  playBtn.textContent = "❚❚";
});
player.addEventListener("pause", () => { playBtn.textContent = "▶"; });
player.addEventListener("timeupdate", () => {
  if (cur < 0) return;
  if (!dragging) seek.value = player.currentTime;
  pos.textContent = clock(player.currentTime);
  if (!document.hidden) updateText(player.currentTime);
});
player.addEventListener("seeked", () => updateText(player.currentTime, true));
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateText(player.currentTime, true); });
player.addEventListener("ended", () => {
  if (cur + 1 < rows.length) playChapter(cur + 1);
});

async function init() {
  const params = new URLSearchParams(location.search);
  // no-cache: Pages lets browsers keep files for 10 min, which hides newly published chapters
  const index = await fetch("books/index.json", { cache: "no-cache" }).then(r => r.json());
  const slug = params.get("book") || index[0]?.slug;
  if (!slug) { $("chapters").innerHTML = '<p class="msg">No books yet.</p>'; return; }

  base = `books/${slug}/`;
  book = await fetch(base + "book.json", { cache: "no-cache" }).then(r => r.json());
  document.title = book.title;
  $("title").textContent = book.title;
  $("author").textContent = book.author;

  book.chapters.forEach((ch, i) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "ch-item";
    item.innerHTML = `<span class="num">${pad(i + 1)}</span><span class="t"></span><span class="dur">${fmt(ch.duration)}</span>`;
    item.querySelector(".t").textContent = ch.title;
    item.addEventListener("click", () => playChapter(i));
    rows.push({ ch, item });
    $("chapters").append(item);
  });
  applyRate();
  if (rows.length) selectChapter(0);
}

init().catch(e => { $("chapters").innerHTML = `<p class="msg">Could not load: ${e.message}</p>`; });
</script>
</body>
</html>
